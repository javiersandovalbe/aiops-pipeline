# prometheus/rules/aiops_latency.yml
groups:
- name: aiops_baseline
  interval: 1m
  rules:
  - record: svc:latency_p95:5m
    expr: |
      histogram_quantile(0.95,
        sum by (service, env, le) (rate(http_server_duration_seconds_bucket[5m])))
  - record: svc:latency_p95:smooth
    expr: avg_over_time(svc:latency_p95:5m[15m])
  # Misma hora de la semana en las ultimas 4 semanas (una serie por semana, label "week")
  - record: svc:latency_p95:weekly_sample
    expr: |
      label_replace(avg_over_time(svc:latency_p95:5m[15m] offset 1w), "week", "1", "", "")
      or label_replace(avg_over_time(svc:latency_p95:5m[15m] offset 2w), "week", "2", "", "")
      or label_replace(avg_over_time(svc:latency_p95:5m[15m] offset 3w), "week", "3", "", "")
      or label_replace(avg_over_time(svc:latency_p95:5m[15m] offset 4w), "week", "4", "", "")
  - record: svc:latency_p95:seasonal_mean
    expr: avg without (week) (svc:latency_p95:weekly_sample)
  - record: svc:latency_p95:seasonal_std
    expr: stddev without (week) (svc:latency_p95:weekly_sample)
  - record: svc:latency_p95:seasonal_weeks
    expr: count without (week) (svc:latency_p95:weekly_sample)
  - record: svc:latency_p95:zscore
    expr: |
      (svc:latency_p95:smooth - svc:latency_p95:seasonal_mean)
        / clamp_min(svc:latency_p95:seasonal_std, 0.05)

- name: aiops_alerts
  rules:
  - alert: LatencyAnomaly
    expr: |
      svc:latency_p95:zscore > 3
      and svc:latency_p95:smooth > 1.3 * svc:latency_p95:seasonal_mean
      and on (service, env) svc:latency_p95:seasonal_weeks >= 3
      and on (service, env) sum by (service, env) (rate(http_server_duration_seconds_count[5m])) > 1
      unless on (service, env) (deploy_window_active == 1)
    for: 10m
    labels:
      severity: warning
      aiops_stage: anomaly
    annotations:
      summary: "p95 de {{ $labels.service }} ({{ $labels.env }}) anomalo: z={{ $value | printf \"%.1f\" }}"
      runbook_url: "https://runbooks.example.com/latency-anomaly"
      dashboard: "https://grafana.example.com/d/svc-overview?var-service={{ $labels.service }}"
  - alert: PostDeployRegression
    expr: |
      svc:latency_p95:zscore > 4
      and on (service, env) svc:latency_p95:seasonal_weeks >= 3
      and on (service, env) (deploy_window_active == 1)
    for: 5m
    labels:
      severity: page
      aiops_stage: anomaly
      team: release
    annotations:
      summary: "Regresion de latencia tras deploy en {{ $labels.service }} ({{ $labels.env }})"
      runbook_url: "https://runbooks.example.com/post-deploy-rollback"
  - alert: ServiceDown
    expr: sum by (service, env) (up) == 0
    for: 2m
    labels:
      severity: page
      root_cause: "true"
    annotations:
      summary: "{{ $labels.service }} sin instancias arriba en {{ $labels.env }}"
